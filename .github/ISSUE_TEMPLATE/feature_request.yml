name: Feature Request
description: Suggest an idea or feature enhancement for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please note this is an MVP market test with a tightly scoped roadmap.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what problem this feature solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
    validations:
      required: false
