# Production Compose for pre-launch backend
# Targets a small VM (Oracle free-tier or similar) behind Cloudflare Tunnel
# API and Postgres communicate over an internal network with NO published host ports.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-crowdfunding}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # NO ports published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crowdfunding}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M

  api:
    image: ${API_IMAGE:-ghcr.io/mehdawimohamed/pre-launch-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-crowdfunding}?schema=public
    networks:
      - internal
    # NO ports published to host; cloudflared proxies traffic to api:3001 internally
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set}
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

networks:
  internal:
    driver: bridge
    internal: false # allows cloudflared to reach Cloudflare edge outbound

volumes:
  postgres_data:
    name: pre_launch_postgres_data

